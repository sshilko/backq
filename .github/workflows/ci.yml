name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  dockerized-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build PHP image with GitHub Actions cache
        uses: docker/build-push-action@v6
        with:
          context: build
          file: build/Dockerfile.php83
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: app/php83

      - name: Pull dependency containers
        run: docker pull redis:7-alpine && docker pull nsqio/nsq:v1.3.0

      - name: Cache tool caches
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: |
            tmp/psalm-cache
            tmp/phpstan
            .phan/cache
          key: ${{ runner.os }}-quality-cache-${{ hashFiles('composer.lock', 'build/psalm.xml', 'build/phpstan.neon', 'build/phan.php') }}
          restore-keys: |
            ${{ runner.os }}-quality-cache-

      - name: Start services
        run: docker compose -f build/docker-compose.yaml up -d --pull never --wait redis nsq app-php83

      - name: Install dependencies inside the container
        run: docker compose -f build/docker-compose.yaml exec -T app-php83 composer install --no-interaction --prefer-dist

      - name: Run the PHPUnit suite (Redis + NSQ integration)
        run: docker compose -f build/docker-compose.yaml exec -T app-php83 php ./vendor/bin/phpunit --testdox --configuration=phpunit.xml

      - name: Restore tool caches into container
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          for dir in tmp/psalm-cache tmp/phpstan .phan/cache; do
            [ -d "$dir" ] && docker cp "$dir" app-php83:/app/"$dir"
          done

      - name: Run the code quality suite
        run: docker compose -f build/docker-compose.yaml exec -T app-php83 composer app-code-quality

      - name: Save tool caches from container
        if: always()
        run: |
          mkdir -p tmp/psalm-cache tmp/phpstan .phan/cache
          for dir in tmp/psalm-cache tmp/phpstan .phan/cache; do
            docker cp app-php83:/app/"$dir" "$dir"
          done

      - name: Stop services
        if: always()
        run: docker compose -f build/docker-compose.yaml down -v
