x-app: &app
  tty: true
  dns: 1.1.1.1
  stop_grace_period: 5s
  platform: linux/amd64
  logging:
    options:
      max-size: "1m"
      max-file: "2"
  ulimits:
    nproc: 65535
    nofile:
      soft: 262140
      hard: 262140
  tmpfs:
    - /tmp
  volumes:
    - ./php.ini:/usr/local/etc/php/php.ini:ro
    - ./../:/app:rw
    - composer-cache:/tmp/composer:rw
  environment:
    XDEBUG_MODE: "off"
    COMPOSER_NO_AUDIT: "1"
    COMPOSER_CACHE_DIR: /tmp/composer
    COMPOSER_PROCESS_TIMEOUT: 300
    COMPOSER_NO_INTERACTION: "1"
    COMPOSER_DISABLE_XDEBUG_WARN: "1"
    BACKQ_REDIS_HOST: "redis"
    BACKQ_REDIS_PORT: "6379"
    BACKQ_NSQD_HOST: "nsq"
    BACKQ_NSQD_PORT: "4150"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: on-failure:2

services:
  app-php83:
    <<: *app
    image: app/php83
    container_name: app-php83
    build:
      context: .
      dockerfile: Dockerfile.php83
    depends_on:
      redis:
        condition: service_healthy
      nsq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 1s
      retries: 2
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: backq-redis
    platform: linux/amd64
    logging:
      options:
        max-size: "1m"
        max-file: "2"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:16379:6379"

  nsq:
    image: nsqio/nsq:v1.3.0
    container_name: backq-nsq
    command: ["/nsqd", "--broadcast-address=nsq", "--data-path=/data"]
    platform: linux/amd64
    logging:
      options:
        max-size: "1m"
        max-file: "2"
    tmpfs:
      - /data
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4151/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:14150:4150"
      - "127.0.0.1:14151:4151"

volumes:
  composer-cache:
