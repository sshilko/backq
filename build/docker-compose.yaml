# Pins the project name so the container_name values below stay stable no matter which
# directory compose is invoked from. Without it, `cd build && docker compose up` derives
# the project name from the directory ("build") and then collides with the containers the
# root invocation created. COMPOSE_PROJECT_NAME still takes precedence over this field;
# .env sets it to "backq", so both agree.
name: backq

x-app: &app
  tty: true
  dns: 1.1.1.1
  stop_grace_period: 5s
  platform: linux/amd64
  logging:
    options:
      max-size: "1m"
      max-file: "2"
  ulimits:
    nproc: 65535
    nofile:
      soft: 262140
      hard: 262140
  tmpfs:
    - /tmp
  volumes:
    - ./php.ini:/usr/local/etc/php/php.ini:ro
    - ./../:/app:rw
    - composer-cache:/tmp/composer:rw
  environment:
    XDEBUG_MODE: "off"
    COMPOSER_NO_AUDIT: "1"
    COMPOSER_CACHE_DIR: /tmp/composer
    COMPOSER_PROCESS_TIMEOUT: 300
    COMPOSER_NO_INTERACTION: "1"
    COMPOSER_DISABLE_XDEBUG_WARN: "1"
    BACKQ_REDIS_HOST: "redis"
    BACKQ_REDIS_PORT: "6379"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: on-failure:2

services:
  app-php83:
    <<: *app
    image: app/php83
    container_name: app-php83
    build:
      context: .
      dockerfile: Dockerfile.php83
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 1s
      retries: 2
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: backq-redis
    platform: linux/amd64
    logging:
      options:
        max-size: "1m"
        max-file: "2"
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:16379:6379"

volumes:
  composer-cache:
